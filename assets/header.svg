<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">Tomasz Szewczyk - Connected TV Lead</title>
  <desc id="desc">Senior Frontend Engineer and Connected TV Lead. Wroclaw, Poland. Remote. 10+ years.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="55%" stop-color="#10203a"/>
      <stop offset="100%" stop-color="#0d1830"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7eb6ff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#9ec8ff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7eb6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d7eff"/>
      <stop offset="70%" stop-color="#7eb6ff"/>
      <stop offset="100%" stop-color="#3d7eff" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="orbA" cx="20%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#3d7eff" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#3d7eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="88%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#1b3a6b" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#1b3a6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1118" height="338" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1120" height="340" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <circle cx="180" cy="0" r="220" fill="url(#orbA)" filter="url(#soft)"/>
    <circle cx="980" cy="340" r="240" fill="url(#orbB)" filter="url(#soft)"/>
    <rect x="0" y="0" width="1120" height="1" fill="url(#shine)"/>
  </g>
  <rect x="1" y="1" width="1118" height="338" rx="22" fill="none" stroke="#7eb6ff" stroke-opacity=".18"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <g transform="translate(56, 48)">
      <circle cx="6" cy="7" r="5" fill="#ff4d5a">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="12" fill="#f3f6fb" font-size="13" font-weight="700" letter-spacing="2.4">LIVE</text>
      <text x="68" y="12" fill="#93a4bf" font-size="13" letter-spacing="1.6">CONNECTED TV  |  OTT</text>
    </g>

    <text x="56" y="132" fill="#f7f9fc" font-size="44" font-weight="700" letter-spacing="-0.6">Tomasz Szewczyk</text>
    <text x="56" y="176" fill="#c5d2e8" font-size="20">Senior Frontend Engineer  |  Connected TV Lead</text>
    <text x="56" y="214" fill="#8b9bb3" font-size="15">Wroclaw, Poland  |  Remote  |  10+ years shipping to the living room</text>

    <rect x="56" y="248" width="1008" height="4" rx="2" fill="#1c2c44"/>
    <rect x="56" y="248" width="412" height="4" rx="2" fill="url(#bar)"/>
    <circle cx="468" cy="250" r="6" fill="#e8f1ff"/>

    <text x="56" y="292" fill="#9eb0c9" font-size="13" letter-spacing="1.4">TIZEN</text>
    <text x="140" y="292" fill="#4a5d78" font-size="13">/</text>
    <text x="160" y="292" fill="#9eb0c9" font-size="13" letter-spacing="1.4">WEBOS</text>
    <text x="244" y="292" fill="#4a5d78" font-size="13">/</text>
    <text x="264" y="292" fill="#9eb0c9" font-size="13" letter-spacing="1.4">ROKU</text>
    <text x="336" y="292" fill="#4a5d78" font-size="13">/</text>
    <text x="356" y="292" fill="#9eb0c9" font-size="13" letter-spacing="1.4">HLS / DASH</text>
    <text x="900" y="292" fill="#7f93ad" font-size="13" letter-spacing="1.2">tomekszewczyk.dev</text>
  </g>
</svg>
